name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # gradle.properties pins org.gradle.java.home to a local macOS path to work
      # around a developer machine's global ~/.gradle config. That path does not
      # exist on the Linux runner, so drop the pin here and let this job's JDK 17
      # (JAVA_HOME, set by setup-java) drive Gradle instead.
      - name: Use the runner's JDK for Gradle
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      - name: Run JVM Unit Tests
        run: ./gradlew test

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Assemble Release APK
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
