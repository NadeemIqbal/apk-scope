android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Checkpoint 5.3: pin Gradle's own JVM explicitly — global ~/.gradle/gradle.properties (shared with an unrelated React Native project) currently restricts org.gradle.java.installations.paths to JDK 17 with auto-download disabled, and something is requesting a languageVersion=25 toolchain even for the most minimal task (./gradlew help), causing every build in this project to fail at daemon bootstrap. Pinning org.gradle.java.home here (project-local, does not touch the shared global file) sidesteps that toolchain-resolution path entirely.
org.gradle.java.home=/opt/homebrew/opt/openjdk@17

# Checkpoint 5.3: override the global ~/.gradle/gradle.properties restriction (added for an
# unrelated React Native project) that pins org.gradle.java.installations.paths to only JDK 17 with
# auto-download disabled — this project's Gradle 9.7.1 + Kotlin Gradle Plugin 2.4.10 combination
# needs toolchain auto-detection/auto-download enabled to resolve internally, or every build
# (even ./gradlew help) fails at daemon bootstrap with "Cannot find a Java installation... matching
# languageVersion=25". Project-local gradle.properties overrides the global file per-project, so
# this does not affect the other project the global restriction was written for.
org.gradle.java.installations.auto-download=true
