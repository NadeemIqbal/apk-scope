name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # gradle.properties pins org.gradle.java.home to a local macOS path to work
      # around a developer machine's global ~/.gradle config. That path does not
      # exist on the Linux runner, so drop the pin here and let this job's JDK 17
      # (JAVA_HOME, set by setup-java) drive Gradle instead.
      - name: Use the runner's JDK for Gradle
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      # core:staticanalysis unit tests run against real compiled fixture APKs
      # (fixture/obfuscatedfixture/riskfixture). Those APKs are gitignored build
      # outputs, so build them before `test` or the tests fail with
      # "…-debug.apk not found".
      - name: Build fixture APKs for static-analysis tests
        run: ./gradlew :fixture:assembleDebug :obfuscatedfixture:assembleDebug :riskfixture:assembleDebug

      - name: Run JVM Unit Tests
        run: ./gradlew test

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Assemble Release APK
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        if: github.event_name == 'workflow_dispatch' && success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

  update-release:
    name: Update GitHub Release (Manual)
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-unsigned
          path: release-assets

      - name: Create or update versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version_name"
          release_tag="v${version_name}"
          apk_path="$(find release-assets -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          release_filename="APK-Scope-${release_tag}.apk"
          release_apk="release-assets/${release_filename}"
          mv "$apk_path" "$release_apk"

          if gh release view "$release_tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$release_apk" --repo "$GH_REPO" --clobber
            gh release view "$release_tag" --repo "$GH_REPO" --json assets --jq \
              '.assets[].name | select(endswith(".apk")) | select(. != "'"$release_filename"'")' |
              while IFS= read -r old_apk; do
                test -z "$old_apk" || gh release delete-asset "$release_tag" "$old_apk" --repo "$GH_REPO" --yes
              done
            gh release edit "$release_tag" --repo "$GH_REPO" \
              --title "APK Scope ${release_tag}" \
              --notes "Automated build from commit ${GITHUB_SHA}."
          else
            gh release create "$release_tag" "$release_apk" --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "APK Scope ${release_tag}" \
              --notes "Automated build from commit ${GITHUB_SHA}."
          fi
